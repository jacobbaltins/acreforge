 banner.innerHTML='<div><strong>Illustrative sample project</strong><span>Example objects and assumptions only—not your property, a survey, or verified conditions. Changes are saved separately from your property in this browser.</span></div><div class="af-sample-actions"><button type="button" class="btn ghost" data-sample-dashboard>Project dashboard</button><button type="button" class="btn ghost" data-sample-return>Return to my property</button><button type="button" class="btn" data-sample-reset>Reset sample</button></div>';
 content.parentNode.insertBefore(banner,content);
 banner.querySelector("[data-sample-dashboard]").onclick=()=>document.querySelector('#nav [data-page="dashboard"]')?.click();
 banner.querySelector("[data-sample-return]").onclick=()=>switchProjectMode(false);
 banner.querySelector("[data-sample-reset]").onclick=()=>{if(!confirm("Reset the illustrative sample to its original starter layout? Your separate property project will not be changed."))return;try{localStorage.removeItem(workspace.sampleStorage);localStorage.removeItem(workspace.sampleRecovery);const next=new URL(location.href);next.searchParams.set("sample","1");location.replace(next.href)}catch(e){alert("The sample could not be reset in this browser. Your property project was not changed.")}};
}

 if(!d||d.dataset.afEnhanced)return;d.dataset.afEnhanced="1";
 const fresh=isFreshUserProject(),build=d.querySelector("[data-start-build]"),explore=d.querySelector("[data-start-explore]"),form=d.querySelector("[data-start-form]"),intent=d.querySelector("#afStartIntent");

 else{title.textContent=fresh?"Start a property or explore a sample":"Continue your property or explore a sample";intro.textContent="Your property and the illustrative sample are saved separately in this browser. Sample objects, dimensions and assumptions are conceptual—not survey or verified property data. Public map data is requested only when you choose those tools.";build.textContent=fresh?"Start a new property →":"Continue my property →";explore.textContent="Explore sample project →"}
 const nameLabel=document.createElement("label");nameLabel.htmlFor="afStartName";nameLabel.textContent="Property name";
 const nameInput=document.createElement("input");nameInput.type="text";nameInput.id="afStartName";nameInput.name="propertyName";nameInput.maxLength=80;nameInput.required=true;nameInput.value="My property";nameInput.autocomplete="off";
 nameInput.oninput=()=>nameInput.setCustomValidity("");
 form.insertBefore(nameInput,form.firstChild);form.insertBefore(nameLabel,nameInput);intent.required=false;
 const intentLabel=form.querySelector('label[for="afStartIntent"]');if(intentLabel)intentLabel.textContent="Planning idea (optional)";

 const submit=form.querySelector("button[type=submit]");if(submit)submit.textContent="Create property and continue →";
 build.onclick=()=>{if(SAMPLE_MODE||!isFreshUserProject()){d.close();document.querySelector('#nav [data-page="dashboard"]')?.click();return}form.hidden=false;nameInput.focus()};
 explore.onclick=()=>{if(SAMPLE_MODE)switchProjectMode(false);else switchProjectMode(true)};
 form.onsubmit=e=>{e.preventDefault();const name=nameInput.value.trim(),description=intent.value.trim();if(!name){nameInput.setCustomValidity("Enter a property name.");nameInput.reportValidity();return}nameInput.setCustomValidity("");if(!isFreshUserProject()){if(caption)caption.textContent="This project now contains work and was not replaced. Close this dialog to continue, or explore the separate sample.";return}workspace.setProjectName(name);workspace.save();d.close();if(description){document.querySelector('#nav [data-page="planner"]')?.click();const prompt=document.getElementById("plPrompt");if(prompt){prompt.value=description;prompt.focus();prompt.scrollIntoView({block:"center"})}}else{document.querySelector('#nav [data-page="designer"]')?.click();document.getElementById("content")?.focus({preventScroll:true})}};
}
const startStyle=document.createElement("style");startStyle.textContent=`#afGuide .af-start-form input{display:block;width:100%;min-height:44px;margin:0 0 12px;padding:10px;border:1px solid #819e89;border-radius:8px;background:#08130e;color:#fff;font:inherit}#afGuide .af-start-form input:focus-visible{outline:3px solid #9df4bd;outline-offset:3px}.af-sample-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 14px;padding:13px 16px;border:1px solid #79917f;border-radius:12px;background:#20382a;color:#edf5ee}.af-sample-banner>div:first-child{display:grid;gap:4px}.af-sample-banner span{font-size:12px;line-height:1.45;color:#d1dfd2}.af-sample-actions{display:flex;flex-wrap:wrap;gap:8px}.af-sample-actions .btn{min-height:40px}@media(max-width:720px){.af-sample-banner{align-items:stretch;flex-direction:column}.af-sample-actions{display:grid;grid-template-columns:1fr}}`;
document.head.appendChild(startStyle);installSampleBanner();

const first=window.__acreforgeFirstLaunch;delete window.__acreforgeFirstLaunch;if(first)open();enhanceStartDialog(document.getElementById("afGuide"));})();

<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const toast=(m)=>{const t=document.createElement("div");t.className="af-toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)};
// 1 PWA / offline shell
if("serviceWorker"in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
// 2 Skip link + main landmark target
const main=document.querySelector("main.main"),content=$("content");
if(content){content.setAttribute("tabindex","-1");content.id="content"}
const skip=document.createElement("a");skip.className="af-skip";skip.href="#content";skip.textContent="Skip to content";skip.onclick=e=>{e.preventDefault();content&&content.focus()};document.body.prepend(skip);
// 3 Online / offline notices
addEventListener("offline",()=>toast("You're offline. Your work still saves in this browser."));
addEventListener("online",()=>toast("Back online."));
// 4 Per-tab document title, scroll reset, and focus-friendly updates
const baseTitle="AcreForge";
const syncTitle=()=>{const b=document.querySelector("#nav button.active");const label=b?b.textContent.replace(/^[^\w]+/,"").trim():"";document.title=label?label+" | "+baseTitle:document.title.split(" | ").pop()===baseTitle?document.title:"AcreForge | U.S. Land & Estate Planner"};
const nav=$("nav");let lastKey="";
if(content)new MutationObserver(()=>{const b=document.querySelector("#nav button.active");const k=b?b.textContent:"";if(k&&k!==lastKey){lastKey=k;syncTitle();scrollTo(0,0)}}).observe(nav||content,{subtree:true,attributes:true,childList:true});
// 5 Alt+1..9 tab shortcuts, ? help overlay, Esc closes overlay
const closeHelp=()=>{const h=document.querySelector(".af-help");if(h){h.remove();return true}return false};
const typing=e=>/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
const storageInfo=()=>{try{let n=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=k.length+(localStorage.getItem(k)||"").length}return(n*2/1048576).toFixed(2)+" MB of roughly 5 MB used"}catch(e){return"unavailable"}};
const openHelp=()=>{if(closeHelp())return;const h=document.createElement("div");h.className="af-help";h.setAttribute("role","dialog");h.setAttribute("aria-modal","true");h.setAttribute("aria-label","Keyboard shortcuts");h.innerHTML='<div><h2>Keyboard shortcuts</h2><p><kbd>Alt</kbd>+<kbd>1</kbd>–<kbd>9</kbd> Jump to a tab</p><p><kbd>?</kbd> Show or hide this help</p><p><kbd>Esc</kbd> Close dialogs</p><p style="color:#9aa9a0;margin-top:14px">Browser storage: '+storageInfo()+'.</p><p style="color:#9aa9a0">Install: use your browser menu, then Install app, to run AcreForge offline.</p><button type="button" id="afHelpX" style="margin-top:10px">Close</button></div>';h.onclick=e=>{if(e.target===h)h.remove()};document.body.appendChild(h);$("afHelpX").focus();$("afHelpX").onclick=()=>h.remove()};
addEventListener("keydown",e=>{
 if(e.key==="Escape"&&closeHelp())return;
 if(typing(e)||e.ctrlKey||e.metaKey)return;
 if(e.key==="?"){e.preventDefault();openHelp();return}
 if(e.altKey&&/^[1-9]$/.test(e.key)){const b=document.querySelectorAll("#nav button")[+e.key-1];if(b){e.preventDefault();b.click();toast((b.textContent||"").replace(/^[^\w]+/,"").trim())}}
});
// 6 Warn before closing the tab while a save is pending
addEventListener("beforeunload",e=>{const s=$("saveState");if(s&&["saving","problem"].includes(s.dataset.status)){e.preventDefault();e.returnValue=""}});
// 7 Last-saved time shown on hover and to screen readers
const ss=$("saveState");
if(ss){ss.setAttribute("role","status");ss.setAttribute("aria-live","polite");new MutationObserver(()=>{if(/Saved/i.test(ss.textContent))ss.title="Last saved "+new Date().toLocaleTimeString()}).observe(ss,{childList:true,characterData:true,subtree:true})}
// 8 Label unlabeled icon-only buttons and canvases for assistive tech
const label=()=>{document.querySelectorAll("button:not([aria-label])").forEach(b=>{if(!b.textContent.trim()&&b.title)b.setAttribute("aria-label",b.title)});document.querySelectorAll("canvas:not([role])").forEach(c=>{c.setAttribute("role","img");if(!c.getAttribute("aria-label"))c.setAttribute("aria-label","Interactive 3D or plan preview")})};
if(content)new MutationObserver(label).observe(content,{childList:true,subtree:true});label();
// 9 Respect reduced motion for smooth scroll resets
if(matchMedia("(prefers-reduced-motion:reduce)").matches)document.documentElement.style.scrollBehavior="auto";
// 10 Persistent storage request so the browser doesn't evict the saved project
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
