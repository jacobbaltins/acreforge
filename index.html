<details class="card designer-details" data-detail="layers" ${detailsOpen.layers?"open":""}><summary><span>Drawing layers</span><span class="small muted">Visibility &amp; labels</span></summary><div class="details-body"><div style="margin-bottom:10px"><button class="toolbtn" data-action="toggle-labels">${state.layers.Labels===false?"Labels off":"Labels on"}</button></div><div class="layer-grid">${["boundary","Buildings","Pastures","Roads","Paths","Fences","Parking","Utilities","Water","Operations","Fairgrounds","Landscape","Farmland","Town","Access"].map(l=>`<label class="layer-chip"><input type="checkbox" data-layer="${esc(l)}" ${l==="boundary"?state.layers.boundary!==false?"checked":"":state.layers[l]!==false?"checked":""}>${l==="boundary"?"Parcel boundary":esc(l)}</label>`).join("")}</div></div></details>
</div>
<div class="card scene-card"><div class="between"><h3>Interactive isometric preview</h3><div class="row"><span class="pill">2D canvas · WebGL-free</span><button class="toolbtn" data-scene-reset title="Reset isometric view">Reset view</button></div></div><canvas id="scene3d" class="scene-canvas" aria-label="Interactive isometric estate preview. Drag to orbit, Shift-drag or right-drag to pan, and scroll to zoom." tabindex="0"></canvas><div class="between small muted" style="margin-top:8px"><span>Drag to orbit · Shift-drag to pan · wheel to zoom</span><details class="scene-options"><summary>Preview options</summary><div class="row"><button class="toolbtn" data-action="toggle-cut">${sceneCut?"Cutaway: on":"Cutaway: off"}</button><button class="toolbtn" data-action="toggle-auto">${sceneAuto?"Auto-rotate: on":"Auto-rotate: off"}</button></div></details></div></div></div></div>${disclaimerShort()}`;}
function objectEditor(i){const t=templates[i.type];return`<div class="field"><label for="objName">Name</label><input id="objName" data-object-field="name" value="${esc(i.name||t.name)}"></div><div class="inline-fields" style="margin-top:8px"><div class="field"><label>Width (ft)</label><input type="number" min="1" max="10000" step="1" data-object-field="w" value="${i.w}"></div><div class="field"><label>Length (ft)</label><input type="number" min="1" max="10000" step="1" data-object-field="h" value="${i.h}"></div><div class="field"><label>Height (ft)</label><input type="number" min="1" max="300" step="1" data-object-field="height" value="${i.height}"></div><div class="field"><label>Rotation (°)</label><input type="number" min="0" max="359" step="1" data-object-field="rotation" value="${num(i.rotation)}"></div><div class="field"><label>Project phase</label><select data-object-field="phase">${selectOpts([["1","Phase 1"],["2","Phase 2"],["3","Phase 3"]],String(i.phase||"1"))}</select></div><div class="field"><label>Planning status</label><select data-object-field="status">${selectOpts([["Not evaluated","Not evaluated"],["Needs information","Needs information"],["Preliminary","Preliminary"],["User-confirmed","User-confirmed"],["Professionally verified","Professionally verified"]],i.status||"Preliminary")}</select></div><div class="field"><label>Shape</label><select data-object-field="shape">${selectOpts([["rect","Rectangle"],["roundrect","Rounded rectangle"],["circle","Ellipse"],["triangle","Triangle"],["poly","Angled polygon"]],i.shape||"rect")}</select></div><div class="field"><label>Unit cost ($)</label><input type="number" min="0" step="1" data-object-field="unitCost" value="${num(i.unitCost,t.cost)}"></div></div><div class="key-value"><span>Footprint</span><strong>${i.w.toLocaleString()} × ${i.h.toLocaleString()} ft · ${Math.round(areaSqft(i)).toLocaleString()} sq ft · ${acresFor(i).toFixed(3)} ac</strong></div><div class="key-value"><span>Cost method</span><strong>${esc(i.costMethod||t.method)} · ${fmt(i.unitCost)}</strong></div><div class="object-actions" style="margin-top:10px"><button class="btn" data-action="duplicate">Duplicate</button><button class="btn" data-action="lock">${i.locked?"Unlock":"Lock"} object</button><button class="btn danger" data-action="delete-selected">Delete</button></div>`;}
function buildingCards(){return Object.keys(templates).filter(k=>templates[k].cat==="Building").map(k=>{const t=templates[k],i=items().find(x=>x.type===k);return`<div class="card"><div class="between"><div class="row"><i class="swatch" style="background:${t.color}"></i><h3 style="margin:0">${esc(t.name)}</h3></div><span class="pill">${i?"Placed":"Not placed"}</span></div><div class="key-value"><span>Planning footprint</span><strong>${i?i.w:t.w} × ${i?i.h:t.h} ft</strong></div><div class="key-value"><span>Illustrative cost basis</span><strong>${fmt(i?.unitCost??t.cost)}${t.method==="fixed"?" / unit":t.method==="sqft"?" / sq ft":""}</strong></div>${buildingPlan(k,i)}</div>`}).join("")}
function buildingPlan(k,i){const configs={barn:["Stall count","20"],arena:["Bleacher rows","3"],event:["Tables","24"],shop:["Service bays","3"],stand:["Display counters","2"],yurt:["Units","2"]};const [label,def]=configs[k]||["Units","1"];const val=i?.[k+"Count"]??def;return`<div style="margin-top:10px">${floorPlanSvg(k,num(val),i?.w||templates[k].w,i?.h||templates[k].h)}</div><div class="inline-fields" style="margin-top:9px"><div class="field"><label>${label}</label><input type="number" min="0" data-plan="${k}" value="${val}"></div><div class="field"><label>Displayed area</label><input value="${((i?.w||templates[k].w)*(i?.h||templates[k].h)).toLocaleString()} sq ft" readonly></div></div>`;}
function floorPlanSvg(k,count,w,h){const titles={barn:"Stalls and center aisle",arena:"Footing and viewing",event:"Hall and service zones",shop:"Service bays and support",stand:"Retail display area",yurt:"Two-unit caretaker concept"};let shapes="";
if(k==="barn"){for(let n=0;n<Math.min(20,Math.max(0,count));n++){const x=(n%10)*14.4+1.4,y=n<10?2:27;shapes+=`<rect x="${x}" y="${y}" width="12" height="12" fill="#9a5b2a" stroke="#d39a69"/><text x="${x+6}" y="${y+8}" text-anchor="middle" fill="#fff" font-size="4">S${n+1}</text>`}shapes+=`<rect x="1" y="15" width="142" height="10" fill="#5b6260"/><text x="72" y="22" text-anchor="middle" fill="#fff" font-size="5">12 ft center aisle</text><rect x="130" y="39" width="13" height="8" fill="#52624c"/>`}
else if(k==="arena"){shapes=`<rect x="3" y="3" width="138" height="68" fill="#806c4d" stroke="#d0b489"/><text x="72" y="37" text-anchor="middle" fill="#fff" font-size="8">RIDING FOOTING</text>`;for(let n=0;n<Math.min(8,count);n++)shapes+=`<line x1="10" y1="${10+n*4}" x2="42" y2="${10+n*4}" stroke="#d6d3d1" stroke-width="1"/>`;shapes+=`<rect x="112" y="6" width="25" height="15" fill="#475569"/><text x="124" y="15" text-anchor="middle" fill="#fff" font-size="5">VIEWING</text>`}
else if(k==="event"){shapes=`<rect x="1" y="1" width="98" height="48" fill="#412345" stroke="#d580e3"/><text x="50" y="7" text-anchor="middle" fill="#fff" font-size="5">EVENT HALL</text><rect x="101" y="1" width="42" height="24" fill="#57402d" stroke="#d6a868"/><text x="122" y="14" text-anchor="middle" fill="#fff" font-size="5">KITCHEN</text><rect x="101" y="27" width="20" height="22" fill="#354653" stroke="#8ba9bc"/><text x="111" y="40" text-anchor="middle" fill="#fff" font-size="4">REST</text><rect x="123" y="27" width="20" height="22" fill="#354653" stroke="#8ba9bc"/><text x="133" y="40" text-anchor="middle" fill="#fff" font-size="4">STAGE</text>`;for(let n=0;n<Math.min(24,count);n++){const x=10+(n%6)*14,y=15+Math.floor(n/6)*8;shapes+=`<circle cx="${x}" cy="${y}" r="2.5" fill="#eac76e"/>`}}
else if(k==="shop"){shapes=`<rect x="1" y="1" width="108" height="48" fill="#143b47" stroke="#40c8dc"/><rect x="112" y="1" width="31" height="23" fill="#38505a"/><rect x="112" y="26" width="31" height="23" fill="#38505a"/><text x="127" y="14" text-anchor="middle" fill="#fff" font-size="4">OFFICE</text><text x="127" y="39" text-anchor="middle" fill="#fff" font-size="4">PARTS</text>`;for(let n=0;n<Math.min(8,count);n++){const x=5+(n%4)*25,y=n<4?5:27;shapes+=`<rect x="${x}" y="${y}" width="20" height="17" fill="none" stroke="#d9f0f4"/><text x="${x+10}" y="${y+10}" text-anchor="middle" fill="#d9f0f4" font-size="4">BAY ${n+1}</text>`}}
else if(k==="stand"){shapes=`<rect x="1" y="1" width="141" height="48" fill="#451f2a" stroke="#f08ca7"/><rect x="7" y="8" width="22" height="32" fill="#97374e"/><text x="18" y="26" text-anchor="middle" fill="#fff" font-size="4">ENTRY</text>`;for(let n=0;n<Math.min(8,count);n++){const x=38+(n%4)*25,y=n<4?10:29;shapes+=`<rect x="${x}" y="${y}" width="18" height="8" fill="#c96877"/><text x="${x+9}" y="${y+6}" text-anchor="middle" fill="#fff" font-size="3">DISPLAY</text>`}}
else shapes=`<rect x="10" y="10" width="49" height="28" rx="10" fill="#645219" stroke="#eac957"/><rect x="84" y="10" width="49" height="28" rx="10" fill="#645219" stroke="#eac957"/><text x="34" y="26" text-anchor="middle" fill="#fff" font-size="6">YURT 1</text><text x="108" y="26" text-anchor="middle" fill="#fff" font-size="6">YURT 2</text><path d="M2 45H142" stroke="#83928a" stroke-dasharray="3"/>`;
return`<svg viewBox="0 0 144 52" role="img" aria-label="${esc(titles[k])} conceptual floor plan"><rect x=".5" y=".5" width="143" height="50" fill="#0d1712" stroke="#65756b"/>${shapes}<text x="2" y="51" fill="#a7b8ac" font-size="3">${Math.round(w)} × ${Math.round(h)} ft · conceptual, not to scale</text></svg>`;}
function buildingsPage(){return pageHead("BUILDING DESIGN","Building Design","Conceptual space planning for the principal estate buildings. Dimensions and interior zones are editable planning assumptions.",btn("Open site designer","page:designer","ghost"))+`<div class="grid g2">${buildingCards()}</div><div class="notice" style="margin-top:14px">Floor-plan diagrams are conceptual arrangements—not architectural drawings. Have licensed professionals determine structure, life safety, accessibility, and construction details.</div>`;}
function infrastructurePage(){const list=[["Utilities & access","Plan utility corridors, service capacity, emergency access, fire flow, turnarounds, and maintenance access."],["Water","Confirm source, legal availability, quantity, seasonal reliability, storage, and water quality."],["Wastewater","Confirm site suitability and capacity for domestic, equestrian, food-service, and event loads."],["Stormwater & erosion","Map drainage patterns and assess erosion, disturbance, and permit requirements."],["Pasture & manure","Plan manure storage, nutrient management, fencing, water, rotations, and all-weather access."],["Traffic & parking","Estimate event and daily trips; verify access, parking, emergency circulation, and road approvals."]];return pageHead("SITE SYSTEMS","Infrastructure Planner","Track concept-level infrastructure topics and connect them to due-diligence tasks. No site feasibility determination is implied.")+
`<div class="grid g2">${list.map(([title,desc],n)=>`<div class="card"><div class="between"><h3>${title}</h3><span class="pill warn">Planning</span></div><p class="small muted">${desc}</p><label class="field"><span class="label">Planning note</span><textarea data-infra="${n}" placeholder="Record a question, assumption, or professional follow-up…">${esc(state.notes[n]||"")}</textarea></label></div>`).join("")}</div><div class="notice blueish" style="margin-top:14px">Infrastructure cost allowances are not engineering estimates. Confirm utility availability, permits, connection fees, and construction scope with the relevant providers and licensed professionals.</div>`;}
function financialsPage(){const f=scenario().finance,c=compute();const capRows=Object.keys(templates).map(type=>{const it=items().filter(x=>x.type===type),t=templates[type],qty=it.reduce((s,x)=>s+(t.method==="linear"?Math.max(x.w,x.h):t.method==="acre"?areaSqft(x)/43560:1),0);return{type,t,qty,cost:it.reduce((s,x)=>s+(x.costMethod==="linear"?Math.max(x.w,x.h)*x.unitCost:x.costMethod==="acre"?areaSqft(x)/43560*x.unitCost:x.costMethod==="sqft"||x.costMethod==="area"?areaSqft(x)*x.unitCost:x.unitCost),0)}}).filter(x=>x.qty>0);
const phases=[1,2,3].map(p=>({p,cost:items().filter(i=>String(i.phase)===String(p)).reduce((s,i)=>s+estimateItem(i),0)})),projection=[1,2,3,4,5].map(y=>({y,rev:c.gross*Math.pow(1.03,y-1),opx:c.opex*Math.pow(1.03,y-1)}));
return pageHead("FINANCIAL MODEL","Financials","Editable inputs drive an illustrative annual operating model and site-linked capital budget.",`<span class="pill">${f.linked?"Layout linked":"Manual assumptions"}</span>`)+
`<div class="grid g2"><div class="card stack"><div class="between"><h3>Operating assumptions</h3><label class="row small"><input type="checkbox" data-finance="linked" ${f.linked?"checked":""}> Link to site layout</label></div>${sliderField("Monthly board rate","rate",f.rate,600,1200,25)}${sliderField("Occupied stalls","occupied",f.occupied,0,Math.max(20,f.linked?Math.max(20,items().filter(i=>i.type==="barn").length*20):40),1)}${sliderField("Annual events","events",f.events,0,Math.max(18,f.linked?Math.max(18,items().filter(i=>i.type==="event").length*18):36),1)}${sliderField("Average event site fee","eventFee",f.eventFee,3000,8500,250)}<hr class="divider"><div class="inline-fields">${numberField("Ancillary revenue / year","other",f.other)}${numberField("Base fixed OpEx / year","fixed",f.fixed)}${numberField("Cost / occupied stall / year","stallCost",f.stallCost)}${numberField("Direct cost / event","eventCost",f.eventCost)}${numberField("Contingency (%)","contingency",f.contingency)}<label class="row small"><input type="checkbox" data-finance="payrollOffset" ${f.payrollOffset?"checked":""}> Family labor planning offset (−$90,000)</label></div><div class="small muted">Linked mode uses placed barns/events and selected ancillary categories; unlinked mode uses manual quantities. No barn/event means linked stalls/events are capped at zero.</div></div>
<div class="stack"><div class="grid g2">${kpi("Gross annual revenue",fmt(c.gross),"Boarding + events + ancillary","green")}${kpi("Annual operating expense",fmt(c.opex),"Before financing","amber")}${kpi("Net operating income",fmt(c.noi),"Before financing and tax",c.noi>=0?"green":"rose")}${kpi("Stall breakeven",Number.isFinite(c.breakeven)?`${c.breakeven} stalls`:"Not reached","At current rates and other revenue", "blue")}</div><div class="card"><h3>Transparent calculation</h3><div class="key-value"><span>Boarding</span><strong>${c.occupied} × ${fmt(f.rate)} × 12 = ${fmt(c.occupied*f.rate*12)}</strong></div><div class="key-value"><span>Events</span><strong>${c.events} × ${fmt(f.eventFee)} = ${fmt(c.events*f.eventFee)}</strong></div><div class="key-value"><span>Ancillary</span><strong>${fmt(c.other)}</strong></div><div class="key-value"><span>Revenue − OpEx</span><strong>${fmt(c.gross)} − ${fmt(c.opex)} = ${fmt(c.noi)}</strong></div><div class="key-value"><span>Layout CapEx incl. contingency</span><strong>${fmt(c.capex)}</strong></div><div class="key-value"><span>Simple payback</span><strong>${c.noi>0?(c.capex/c.noi).toFixed(1)+" years":"Not meaningful at current NOI"}</strong></div><p class="tiny muted">Simple payback = illustrative CapEx ÷ annual NOI. Excludes financing, taxes, depreciation, replacement reserves, ramp-up, inflation, and working capital.</p><hr class="divider"><h3>Financing illustration</h3><div class="inline-fields">${numberField("Loan principal","financing",f.financing)}${numberField("Annual interest (%)","interest",f.interest)}${numberField("Term (years)","term",f.term)}</div><div class="key-value"><span>Estimated annual debt service</span><strong>${fmt(c.annualDebt)}</strong></div><div class="key-value"><span>NOI after estimated debt service</span><strong>${fmt(c.afterDebt)}</strong></div><p class="tiny muted">Fixed-rate, fully amortizing monthly-payment estimate. Excludes fees, taxes, covenants, draw schedules, and lender qualification.</p></div></div></div>
<div class="card" style="margin-top:14px"><div class="between"><h3>Site-linked capital budget</h3><span class="pill warn">Placeholder unit costs</span></div><div class="table-wrap"><table><thead><tr><th>Object type</th><th>Quantity</th><th>Cost method</th><th>Estimated subtotal</th></tr></thead><tbody>${capRows.map(r=>`<tr><td>${esc(r.t.name)}</td><td>${r.qty.toFixed(r.t.method==="acre"?2:0)} ${r.t.method==="linear"?"ft":r.t.method==="acre"?"ac":"unit(s)"}</td><td>${esc(r.t.method)} · ${fmt(r.t.cost)}${r.t.method==="sqft"||r.t.method==="area"?" / sf":r.t.method==="acre"?" / ac":r.t.method==="linear"?" / ft":""}</td><td>${fmt(r.cost)}</td></tr>`).join("")||`<tr><td colspan="4">Add objects on the site plan to populate the budget.</td></tr>`}</tbody><tfoot><tr><th colspan="3">Subtotal + ${num(f.contingency)}% contingency</th><th>${fmt(c.capex)}</th></tr></tfoot></table></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Phase-level capital allowance</h3>${phases.map(x=>`<div class="phase"><div><h4>Phase ${x.p}</h4><p>${x.p===1?"Core site & equestrian":x.p===2?"Support facilities":"Public-facing uses"}</p></div><div class="barline"><i style="width:${c.costs?Math.min(100,x.cost/c.costs*100):0}%"></i></div><strong>${fmt(x.cost*(1+num(f.contingency)/100))}</strong></div>`).join("")}<p class="tiny muted">Phase allocations follow each site's object phase field; contingency is applied proportionally.</p></div><div class="card"><h3>Five-year operating illustration</h3><div class="table-wrap"><table><thead><tr><th>Year</th><th>Gross revenue</th><th>Operating expense</th><th>NOI</th></tr></thead><tbody>${projection.map(y=>`<tr><td>${y.y}</td><td>${fmt(y.rev)}</td><td>${fmt(y.opx)}</td><td>${fmt(y.rev-y.opx)}</td></tr>`).join("")}</tbody></table></div><p class="tiny muted">Illustrative 3% annual growth for revenue and operating costs, held constant; no ramp-up, financing, taxes, or inflation-specific adjustment.</p></div></div>${disclaimerShort()}`;}
function sliderField(label,key,val,min,max,step){return`<div class="field"><div class="between"><label for="fin-${key}">${label}</label><strong>${key==="rate"||key==="eventFee"?fmt(val):Number(val).toLocaleString()}</strong></div><div class="range-row"><input id="fin-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${num(val)}" data-finance="${key}"><input aria-label="${label} exact value" type="number" min="${min}" max="${max}" step="${step}" value="${num(val)}" data-finance="${key}"></div></div>`}
function numberField(label,key,val){return`<div class="field"><label>${label}</label><input type="number" min="0" data-finance="${key}" value="${num(val)}"></div>`}
function operationsPage(){const c=compute(),o=state.operations;const staff=[["Barn attendants",`Occupied stalls ÷ ${o.barnRatio}`,Math.ceil(c.occupied/Math.max(1,o.barnRatio))],["Barn manager","Baseline planning allowance",items().some(i=>i.type==="barn")?1:0],["Farm & grounds",`Pasture acres ÷ ${o.landRatio}`,Math.ceil(c.past/Math.max(1,o.landRatio))],["Event support",`Events × ${o.eventRatio}`,c.events*o.eventRatio],["Farm stand","Seasonal coverage allowance",items().some(i=>i.type==="stand")?1:0]];
return pageHead("OPERATIONS","Operations & Staffing","Illustrative staffing quantities for workload discussion. Adjust the planning ratios; they are not labor or safety guidance.",btn("Review labor due diligence","page:compliance","ghost"))+`<div class="grid g2"><div class="card"><h3>Staffing workload assumptions</h3><div class="inline-fields">${numberField("Stalls per attendant","barnRatio",o.barnRatio).replace('data-finance="barnRatio"','data-operation="barnRatio"')}${numberField("Pasture acres per worker","landRatio",o.landRatio).replace('data-finance="landRatio"','data-operation="landRatio"')}${numberField("Event support per event","eventRatio",o.eventRatio).replace('data-finance="eventRatio"','data-operation="eventRatio"')}</div><p class="tiny muted">Edit ratios here. Actual staffing depends on service scope, schedules, law, and safe operations.</p></div><div class="card"><h3>Illustrative workload result</h3>${staff.map(([role,calc,n])=>`<div class="key-value"><span>${role}<small class="muted" style="display:block">${calc}</small></span><strong>${n} planning units</strong></div>`).join("")}<div class="notice" style="margin-top:10px">These are workload indicators, not a staffing plan, headcount commitment, wage estimate, or determination of employment requirements.</div></div></div><div class="card" style="margin-top:14px"><h3>Operating topics</h3><div class="grid g3"><div><h4>Animal care</h4><p class="small muted">Daily care coverage, veterinary coordination, emergency response, feed and bedding, and safe horse handling.</p></div><div><h4>Property operations</h4><p class="small muted">Equipment maintenance, pasture rotation, manure handling, water systems, access roads, and seasonal workloads.</p></div><div><h4>Public-facing activity</h4><p class="small muted">Event staffing, traffic coordination, food-service oversight, security, and customer-facing hours.</p></div></div></div>`;}
